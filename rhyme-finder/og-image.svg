<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Warm xuan-paper background. -->
  <rect width="1200" height="630" fill="#dcc28e"/>

  <!-- Subtle horizontal fiber lines suggesting xuan-paper texture. -->
  <g stroke="#1a140e" stroke-width="0.4" opacity="0.05">
    <line x1="0" y1="120" x2="1200" y2="118"/>
    <line x1="0" y1="220" x2="1200" y2="223"/>
    <line x1="0" y1="340" x2="1200" y2="338"/>
    <line x1="0" y1="450" x2="1200" y2="452"/>
    <line x1="0" y1="540" x2="1200" y2="538"/>
  </g>

  <!-- Shanshui painting, scaled up from the index hero (viewBox 320×200 → 540×338). -->
  <g transform="translate(80 110) scale(1.7)">
    <!-- Distant range -->
    <path d="M0 92 C 30 70, 56 82, 88 64 C 118 48, 146 70, 178 56 C 210 42, 240 64, 272 48 C 296 36, 312 50, 320 44"
          fill="none" stroke="#1a140e" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.32"/>
    <!-- Middle range -->
    <path d="M0 124 C 22 108, 48 118, 76 102 C 102 88, 132 110, 164 96 C 196 82, 224 104, 256 92 C 282 82, 304 96, 320 88"
          fill="none" stroke="#1a140e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <!-- Front range -->
    <path d="M0 156 C 18 142, 40 154, 64 138 C 88 122, 116 144, 142 134 C 168 124, 196 142, 224 130 C 250 118, 274 134, 298 124 C 312 118, 318 122, 320 120"
          fill="none" stroke="#1a140e" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
    <!-- Pine silhouettes -->
    <g fill="#1a140e" opacity="0.7">
      <path d="M62 138 L 64 128 L 66 138 Z"/>
      <path d="M138 134 L 140 124 L 142 134 Z"/>
      <path d="M222 130 L 224 121 L 226 130 Z"/>
    </g>
    <!-- Boat with red sail -->
    <g opacity="0.85">
      <path d="M22 178 C 30 176, 46 176, 54 178" fill="none" stroke="#1a140e" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M26 178 L 50 178" fill="none" stroke="#1a140e" stroke-width="0.7" stroke-linecap="round"/>
      <line x1="38" y1="178" x2="38" y2="166" stroke="#1a140e" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M38 167 C 44 167, 49 170, 50 176 C 47 175, 42 175, 38 176 Z" fill="#b13b2c" opacity="0.92"/>
      <path d="M38 167 C 44 167, 49 170, 50 176" fill="none" stroke="#8a2a1e" stroke-width="0.45" stroke-linecap="round" opacity="0.7"/>
    </g>
    <!-- Water strokes -->
    <g stroke="#1a140e" fill="none" stroke-linecap="round" opacity="0.32">
      <path d="M174 184 L 220 184" stroke-width="0.7"/>
      <path d="M236 188 L 282 188" stroke-width="0.6"/>
    </g>
  </g>

  <!-- Wordmark + 韵 seal — right of painting. -->
  <g transform="translate(720 295)">
    <text font-family="'Cormorant Garamond', 'STSong', serif" font-style="normal" font-weight="500" font-size="96" fill="#1a140e" letter-spacing="-1">
      <tspan x="0" y="0">Rhyme</tspan>
      <tspan x="0" y="100">Finder</tspan>
    </text>
    <!-- Vermilion 韵 seal floating after "Finder" -->
    <g transform="translate(290 50) rotate(-3)">
      <rect x="0" y="0" width="60" height="60" rx="2" fill="#b13b2c"/>
      <rect x="0" y="0" width="60" height="60" rx="2" fill="none" stroke="#8a2a1e" stroke-width="2" opacity="0.55"/>
      <text x="30" y="46" text-anchor="middle" font-family="'Songti SC', 'STSong', 'SimSun', serif" font-style="italic" font-weight="600" font-size="40" fill="#dcc28e">韵</text>
    </g>
  </g>

  <!-- Tagline. -->
  <text x="720" y="500" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="400" font-size="34" fill="#3a2e1f" letter-spacing="0.005em">A rhyming dictionary</text>
  <text x="720" y="540" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="400" font-size="34" fill="#3a2e1f" letter-spacing="0.005em">for songwriters.</text>

  <!-- URL footer line, low contrast. -->
  <text x="720" y="595" font-family="'DM Mono', ui-monospace, monospace" font-size="16" font-weight="500" fill="#6e5a3c" letter-spacing="0.18em">RHYME.QI.LAND</text>
</svg>
