<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The 韵 seal — same vermilion 朱印 that floats after "Finder" in the
       wordmark. Western users can't read the character; that's fine — the
       distinctive vermilion square + ink-stamped glyph is the brand mark,
       legible as Rhyme Finder long before anyone parses the meaning. -->
  <rect x="8" y="8" width="48" height="48" rx="2" fill="#b13b2c"/>
  <rect x="8" y="8" width="48" height="48" rx="2"
        fill="none" stroke="#8a2a1e" stroke-width="1.5" opacity="0.5"/>
  <text x="32" y="49"
        text-anchor="middle"
        font-family="'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif"
        font-style="italic"
        font-weight="600"
        font-size="44"
        fill="#dcc28e">韵</text>
</svg>
