<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rhyme as reflection: a peak above, its echo in water below. The two
       vermilion drops sit in mirrored positions — the rhyme is the
       moment they "land alike." Borrows the page's shanshui language but
       makes it carry meaning: mountain finding itself in its reflection
       is the visual cognate of a word finding itself in another. -->

  <!-- Warm xuan-paper background. -->
  <rect width="64" height="64" rx="6" fill="#dcc28e"/>

  <!-- Real mountain — full ink brush. -->
  <path d="M6 32 C 14 28, 18 24, 24 18 C 28 13, 30 11, 32 11
           C 34 11, 36 13, 40 18 C 46 24, 50 28, 58 32 Z"
        fill="#1a140e" opacity="0.88"/>

  <!-- Vermilion sun resting just off the peak — the source point. -->
  <circle cx="40" cy="14" r="3.2" fill="#b13b2c"/>

  <!-- Horizon — a hair of ink across the water's surface. -->
  <line x1="4" y1="33.5" x2="60" y2="33.5"
        stroke="#1a140e" stroke-width="0.6"
        stroke-linecap="round" opacity="0.5"/>

  <!-- Reflection — same mountain shape, mirrored, faded so the eye reads
       it as water-image rather than a second mountain. -->
  <path d="M6 35 C 14 39, 18 43, 24 49 C 28 54, 30 56, 32 56
           C 34 56, 36 54, 40 49 C 46 43, 50 39, 58 35 Z"
        fill="#1a140e" opacity="0.32"/>

  <!-- The sun's reflection — vermilion drop mirrored on the y-axis,
       slightly fainter, slightly broken so it feels like water. -->
  <circle cx="40" cy="53" r="3.2" fill="#b13b2c" opacity="0.62"/>

  <!-- Two faint water ripples across the reflection so the lower half
       reads unmistakably as water, not just a fainter twin peak. -->
  <g stroke="#1a140e" stroke-width="0.55" stroke-linecap="round" opacity="0.22" fill="none">
    <path d="M14 44 L 24 44"/>
    <path d="M44 48 L 54 48"/>
  </g>
</svg>
